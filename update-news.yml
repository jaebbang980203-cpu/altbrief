name: Update AltBrief News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix current file paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("update_news.py")
          text = collector.read_text(encoding="utf-8")
          text = text.replace(
              "ROOT = Path(__file__).resolve().parents[1]",
              "ROOT = Path(__file__).resolve().parent",
          )
          collector.write_text(text, encoding="utf-8")

          worker = Path("sw.js")
          text = worker.read_text(encoding="utf-8")
          text = text.replace(
              'const CACHE = "altbrief-github-v1";',
              'const CACHE = "altbrief-github-v3";',
          )
          text = text.replace(
              'url.pathname.endsWith("/data/news.json")',
              'url.pathname.endsWith("/news.json")',
          )
          worker.write_text(text, encoding="utf-8")
          PY

      - name: Collect public RSS news
        run: python update_news.py

      - name: Save latest news
        shell: bash
        run: |
          git config user.name "altbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json update_news.py sw.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AltBrief news"
            git push
          fi
