name: AltBrief - Auto Collect News

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'update_news.py'
      - 'sources.json'
      - 'requirements.txt'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: altbrief-auto-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: python -m pip install -r requirements.txt
      - name: Collect Google News RSS
        run: python update_news.py
      - name: Verify updated data
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open('news.json', encoding='utf-8'))
          articles = data.get('articles', [])
          print('Updated at:', data.get('updated_at'))
          print('Success feeds:', data.get('feed_successes'))
          print('Failed feeds:', data.get('feed_failures'))
          print('Article count:', len(articles))
          assert len(articles) > 0, 'No articles found'
          assert any(a.get('id') != 'setup-check' for a in articles), 'Sample news was not replaced'
          PY
      - name: Commit news.json to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if git diff --cached --quiet; then
            echo 'No changes to news.json'
          else
            git commit -m 'chore: refresh AltBrief news'
            git push
          fi
